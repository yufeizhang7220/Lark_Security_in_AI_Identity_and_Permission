<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书文档助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .main-content {
            display: flex;
            gap: 20px;
            height: calc(100vh - 180px);
        }
        .sidebar {
            width: 300px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        .chat-area {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9em;
        }
        textarea {
            width: 100%;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message .timestamp {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
        }
        .message a {
            color: #667eea;
            word-break: break-all;
            text-decoration: underline;
        }
        .message pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9em;
        }
        .message code {
            background: #f0f0f0;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 飞书文档助手</h1>
            <p>基于火山引擎大模型的智能文档助手</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h2>📝 文档需求</h2>
                <div class="input-group">
                    <label>文档标题：</label>
                    <input type="text" id="docTitle" placeholder="请输入文档标题（可选）" style="width: 100%; border: 2px solid #e8e8e8; border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 15px;">
                </div>
                <div class="input-group">
                    <label>请描述您的需求：</label>
                    <textarea id="userInput" rows="8" placeholder="例如：创建一个关于公司最新项目进展的报告，需要查询通讯录和日历数据"></textarea>
                </div>
                <button id="sendBtn" class="btn" onclick="sendMessage()">发送请求</button>
                <div id="status" class="status" style="display: none;"></div>
            </div>

            <div class="chat-area">
                <h2>💬 对话记录</h2>
                <div id="messages" class="messages">
                    <div class="message assistant">
                        您好！我是飞书文档助手。我可以帮助您：
                        <br>- 创建飞书文档
                        <br>- 查询企业数据（通讯录、日历等）
                        <br>- 搜索外部信息
                        <br><br>请在左侧输入您的需求，我将自动判断并调用相应工具。
                    </div>
                </div>
                <div id="loading" class="loading">正在处理中</div>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('messages');
            const sendBtn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');
            const docTitle = document.getElementById('docTitle');

            const userMessage = input.value.trim();
            if (!userMessage) {
                showStatus('请输入需求', 'error');
                return;
            }

            // 构建用户输入，包含标题信息
            let fullInput = userMessage;
            const titleValue = docTitle.value.trim();
            if (titleValue) {
                fullInput = `[文档标题: ${titleValue}]\n\n${userMessage}`;
            }

            // 添加用户消息
            addMessage('user', userMessage);
            input.value = '';
            docTitle.value = '';

            // 显示加载状态
            sendBtn.disabled = true;
            loading.style.display = 'block';
            hideStatus();

            try {
                const response = await fetch('/Lark-doc-Agent/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: fullInput })
                });

                const data = await response.json();

                loading.style.display = 'none';
                sendBtn.disabled = false;

                if (data.status === 'success') {
                    addMessage('assistant', data.data.response);
                    showStatus('处理成功！', 'success');
                } else {
                    addMessage('assistant', '处理失败：' + data.error);
                    showStatus('处理失败：' + data.error, 'error');
                }
            } catch (error) {
                loading.style.display = 'none';
                sendBtn.disabled = false;
                addMessage('assistant', '请求失败：' + error.message);
                showStatus('请求失败：' + error.message, 'error');
            }
        }

        function addMessage(role, content) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;

            const time = new Date().toLocaleTimeString();
            messageDiv.innerHTML = content + '<div class="timestamp">' + time + '</div>';

            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        // 支持回车发送
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
